services:
  application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    container_name: application_nginx_container
    volumes:
      - ..:/usr/share/nginx/html
      - ./nginx/logs:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  application_typescript:
    tty: true
    build: ./typescript
    working_dir: /workspace
    container_name: application_typescript_container
    volumes:
      - ../dist:/workspace/dist
      - ./typescript/node_modules:/workspace/node_modules
      - ../source/application:/workspace/source/application
