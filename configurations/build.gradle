plugins {
    id "java"
    id "war"
    id "org.teavm" version "0.15.0"
}
repositories {
    mavenCentral()
}

dependencies {
    implementation teavm.libs.jsoApis
}

teavm {
    all {
        mainClass = "application.Main"
    }
    js {
        addedToWebApp = true
        targetFileName = "application.js"
    }
    wasmGC {
        addedToWebApp = true
        targetFileName = "application.wasm"
    }
}