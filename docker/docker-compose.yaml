services:
  application_ngrok:
    profiles:
      - ngrok
    env_file:
      - ../.env
    ports:
      - 4040:4040
    restart: unless-stopped
    image: ngrok/ngrok:latest
    command: [ "http", "application_nginx:80" ]
    container_name: application_ngrok_container

  application_nginx:
    tty: true
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    working_dir: /usr/share/nginx/html/
    container_name: application_nginx_container
    volumes:
      - data:/var/log/nginx
      - ../web/build/:/usr/share/nginx/html/:Z
      - ../configurations/nginx.conf:/etc/nginx/conf.d/default.conf:Z

  application_esbuilder:
    tty: true
    profiles:
      - esbuilder
    build: ./esbuilder/
    working_dir: /workspace/
    container_name: application_esbuilder_container
    volumes:
      - web:/workspace/
      - ../web/:/workspace/web/:Z
      - ../build/:/workspace/build/:Z
      - ../configurations/build.go:/workspace/build.go:Z
      - ../configurations/global.ts:/workspace/global.ts:Z
      - ../configurations/tsconfig.json:/workspace/tsconfig.json:Z
      - ../configurations/web.package.json:/workspace/package.json:Z

  application_typescript:
    tty: true
    profiles:
      - typescript
    build: ./typescript/
    working_dir: /workspace/
    container_name: application_typescript_container
    volumes:
      - web:/workspace/
      - data:/root/.npm/_logs/
      - ../web/:/workspace/web/:Z
      - ../configurations/global.d.ts:/workspace/global.d.ts:Z
      - ../configurations/tsconfig.json:/workspace/tsconfig.json:Z
      - ../configurations/web.package.json:/workspace/package.json:Z

  application_tauri:
    ipc: host
    tty: true
    profiles:
      - tauri
    env_file:
      - ../.env
    build: ./tauri/
    stdin_open: true
    devices:
      - /dev/dri:/dev/dri
    working_dir: /workspace/
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - XDG_RUNTIME_DIR=/run/user/1000
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
    container_name: application_tauri_container
    volumes:
      - tauri:/workspace/
      - data:/root/.npm/_logs/
      - ../build/:/workspace/build/:Z
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - tauri_cargo_git:/root/.cargo/git/
      - ~/.Xauthority:/tmp/.Xauthority:ro
      - tauri_cargo_registry:/root/.cargo/registry/
      - ../desktop/source/:/workspace/desktop/src/:Z
      - ../desktop/assets/:/workspace/desktop/icons/:Z
      - ../desktop/build.rs:/workspace/desktop/build.rs:Z
      - /run/user/1000/wayland-0:/run/user/1000/wayland-0:ro
      - ../configurations/global.d.ts:/workspace/global.d.ts:Z
      - ../configurations/tsconfig.json:/workspace/tsconfig.json:Z
      - ../desktop/capabilities/:/workspace/desktop/capabilities/:Z
      - ../configurations/Cargo.toml:/workspace/desktop/Cargo.toml:Z
      - ../configurations/tauri.package.json:/workspace/package.json:Z
      - ../configurations/tauri.conf.json:/workspace/desktop/tauri.conf.json:Z

volumes:
  web:
  data:
  tauri:
  aider:
  tauri_cargo_git:
  tauri_cargo_registry:

networks:
  tauri:
    driver: bridge
