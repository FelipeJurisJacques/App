services:
  application_node:
    tty: true
    ports:
      - 9005:9005
    build: ./typescript/
    working_dir: /workspace/
    volumes:
      - ../:/workspace/
      - ../data/:/root/.npm/_logs/
    container_name: application_node_container
  application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    container_name: application_nginx_container
    volumes:
      - ../public/:/usr/share/nginx/html/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

  application_java:
    tty: true
    ports:
      - 8080:8080
    build: ./java/
    volumes:
      - ../:/workspace/
    working_dir: /workspace/
    container_name: application_java_container

  application_turn:
    restart: unless-stopped
    image: instrumentisto/coturn
    ports:
      - 3478:3478
      - 3478:3478/udp
      - 5349:5349
      - 5349:5349/udp
      - 49152-49200:49152-49200/udp
    command:
      - -n
      - --lt-cred-mech
      - --min-port=49152
      - --max-port=49200
      - --log-file=stdout
      - --realm=localhost
      - --user=user:password
    container_name: application_turn_container
