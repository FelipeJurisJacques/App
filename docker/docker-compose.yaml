services:
  application_alpine:
    tty: true
    build: ./alpine/
    restart: unless-stopped
    volumes:
      - ../frontend/:/workspace/
      - ../data/alpine/log/:/root/.npm/_logs/
      - ./alpine/build.go:/workspace/build.go
    container_name: application_alpine_container
  application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: application_nginx_container
    volumes:
      - ../data/nginx/logs:/var/log/nginx
      - ../frontend/build/:/usr/share/nginx/html/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  application_python:
    tty: true
    build: ./python
    env_file:
      - ./python/.env
    volumes:
      - ../:/workspace/
    restart: unless-stopped
    working_dir: /workspace/
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: application_python_container
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
