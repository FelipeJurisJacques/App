services:
  application_node:
    tty: true
    ports:
      - 9005:9005
    build: ./typescript/
    working_dir: /workspace/
    volumes:
      - ../:/workspace/
      - ../data/:/root/.npm/_logs/
    container_name: application_node_container
  application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    container_name: application_nginx_container
    volumes:
      - ../public/:/usr/share/nginx/html/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

  application_java:
    tty: true
    ports:
      - 8080:8080
    build: ./java/
    working_dir: /workspace/
    volumes:
      - ../:/workspace/
    container_name: application_java_container

  turnserver:
    image: instrumentisto/coturn
    container_name: turn_server_container
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --realm=localhost
      - --user=user:password
      - --lt-cred-mech
