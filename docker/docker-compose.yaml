services:
  application_node:
    tty: true
    ports:
      - 9005:9005
    build: ./typescript/
    working_dir: /workspace/
    volumes:
      - ../:/workspace/
      - ../data/:/root/.npm/_logs/
    container_name: application_node_container
  application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    container_name: application_nginx_container
    volumes:
      - ../public/:/usr/share/nginx/html/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
