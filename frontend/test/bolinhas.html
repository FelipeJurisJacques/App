<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arc Ring — efeito circular</title>
<style>
  :root{
    --bg:#030808;
    --teal:#46e2d9;
    --teal-dim: rgba(70,226,217,.14);
  }
  html,body{height:100%;margin:0}
  body{
    background: radial-gradient(800px 600px at 50% 35%, #042a2b 0%, var(--bg) 45%), var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  }

  /* canvas ocupa área central responsiva */
  .stage{
    width:min(88vmin,720px);
    aspect-ratio:1/1;
    position:relative;
    display:grid;
    place-items:center;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.6));
  }

  canvas{ width:100%; height:100%; display:block; border-radius:50%; }

  /* controle inferior (opcional) */
  .hint{
    position: absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(230,255,250,.65);
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:linear-gradient(180deg, rgba(70,226,217,.03), transparent);
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(70,226,217,.06);
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hint">hover para interagir • clique para ripple</div>
  </div>

<script>
/*
  Arc Ring — Canvas particle ring with wave/noise animation
  - partículas distribuídas em círculo
  - raio variável com função seno + ruído temporal (pseudo-noise)
  - mouse move influencia amplitude/local de ondulação
  - clique cria ripple (onda expandindo)
*/

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: true });

let DPR = Math.max(1, window.devicePixelRatio || 1);

function resize(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * DPR);
  canvas.height = Math.floor(rect.height * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize, { passive:true });
resize();

/* params */
const params = {
  particleCount: 280,       // quantas partículas no anel
  baseRadius: 0.36,         // fração do menor lado (0..0.5)
  ringWidth: 0.12,          // espessura do anel (fração)
  speed: 0.9,               // velocidade global
  amplitude: 18,            // amplitude máxima (px)
  color: [70,226,217],      // rgb
};

/* cria partículas com ângulo e deslocamento inicial */
const particles = new Array(params.particleCount).fill(0).map((_,i)=>{
  const t = i / params.particleCount;
  return {
    i,
    t,                 // 0..1 ao longo do círculo
    phase: Math.random()*Math.PI*2,
    scale: 0.8 + Math.random()*0.6,
  };
});

/* mouse / interação */
let mouse = { x: 0, y: 0, active:false };
const stageRect = canvas.getBoundingClientRect();
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width;   // 0..1
  mouse.y = (e.clientY - r.top)  / r.height;
});
canvas.addEventListener('mouseenter', ()=> mouse.active = true);
canvas.addEventListener('mouseleave', ()=> { mouse.active=false; mouse.x=0.5; mouse.y=0.5; });

/* ripple effects (array de ondas geradas ao clicar) */
const ripples = [];
canvas.addEventListener('click', e=>{
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width;
  const y = (e.clientY - r.top)/r.height;
  // normaliza posição e calcula distância ao centro em fração
  const cx = 0.5, cy = 0.5;
  const dist = Math.hypot((x-cx),(y-cy));
  ripples.push({ t:0, speed: 1.6 + Math.random()*0.6, src: {x,y}, dist });
  // limita ripples
  if(ripples.length>6) ripples.shift();
});

/* pseudo-noise (cheap) usando seno composto — rápido e estável */
function noise(x){
  return Math.sin(x*1.618) * Math.sin(x*0.73*1.414) + Math.sin(x*0.27)*0.4;
}

let last = performance.now();
let time = 0;

function draw(now){
  const dt = (now - last) / 1000;
  last = now;
  time += dt * params.speed;

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0,0, w, h);

  const cx = w/2, cy = h/2;
  const minSize = Math.min(w,h);
  const baseR = minSize * params.baseRadius;          // base radius in px
  const ringW = minSize * params.ringWidth;          // thickness

  // background soft vignette
  const g = ctx.createRadialGradient(cx, cy, minSize*0.1, cx, cy, minSize*0.9);
  g.addColorStop(0, 'rgba(4,30,30,0.20)');
  g.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);

  // atualiza ripples
  for (let r of ripples) r.t += dt * r.speed;
  // remove ripples finished
  for (let i=ripples.length-1;i>=0;i--) if (ripples[i].t>1.6) ripples.splice(i,1);

  // desenha partículas ao longo do círculo
  for (let p of particles){
    const angle = p.t * Math.PI * 2;
    // ruído temporal e local para obter ondulação orgânica
    const n = noise(angle*6 + time*0.9 + p.phase*0.7);
    // influência do mouse: quanto mais perto do setor, maior a amplitude
    // calcula posição do mouse em ângulo
    const mouseAngle = (mouse.x - 0.5) * Math.PI * 2;
    const angDiff = Math.abs(Math.atan2(Math.sin(angle-mouseAngle), Math.cos(angle-mouseAngle)));
    const mouseInfluence = mouse.active ? Math.max(0, 1 - angDiff / Math.PI) : 0; // 0..1
    // ripple influence: soma efeitos de ripples (se houver)
    let rippleInfluence = 0;
    for (let r of ripples){
      // distância do setor ao centro do ripple
      const sectorCenter = { x: 0.5 + Math.cos(angle)*0.5, y: 0.5 + Math.sin(angle)*0.5 };
      const dx = sectorCenter.x - r.src.x;
      const dy = sectorCenter.y - r.src.y;
      const d = Math.hypot(dx,dy); // 0..~1.4
      // ripple shape: passa quando r.t ~ d (ajuste a sensibilidade)
      const s = Math.exp(-Math.pow((d - r.t*1.6)*2.8, 2));
      rippleInfluence += s * (1.6 - d); // combina amplitude
    }

    // combinação final de deslocamento
    const localAmp = params.amplitude * p.scale;
    const offset = (n * localAmp * (0.6 + mouseInfluence*1.2)) + rippleInfluence * 36;

    // calcula raio final para esta partícula
    const rFinal = baseR + (offset);
    const x = cx + Math.cos(angle) * rFinal;
    const y = cy + Math.sin(angle) * rFinal;

    // tamanho e alpha
    const size = 1.0 + p.scale * (1.4 + mouseInfluence*1.6);
    const alpha = 0.12 + 0.5 * Math.max(0, 0.9 + n*0.45) * (0.6 + p.scale*0.6);

    // desenha ponto (com glow)
    ctx.globalCompositeOperation = 'lighter';
    const color = params.color;
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    // glow (blur by multiple circles)
    ctx.beginPath();
    ctx.arc(x, y, size*4.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${0.025 * (1 + p.scale)})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, size*2.2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${0.08 * (1 + p.scale)})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // desenha um anel sutil com contorno
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, baseR + ringW*0.25, 0, Math.PI*2);
  ctx.lineWidth = Math.max(2, ringW*0.06);
  ctx.strokeStyle = 'rgba(70,226,217,0.12)';
  ctx.stroke();
  ctx.restore();

  // contorno brilhante interno
  ctx.save();
  const grad = ctx.createRadialGradient(cx,cy, baseR*0.3, cx,cy, baseR + ringW*0.6);
  grad.addColorStop(0, 'rgba(70,226,217,0.06)');
  grad.addColorStop(0.7, 'rgba(70,226,217,0.02)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy, baseR + ringW*0.6, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

/* inicial posicionamento do mouse (centro) */
mouse.x = 0.5; mouse.y = 0.5;
</script>
</body>
</html>
