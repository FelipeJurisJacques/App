<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS | Advanced Sci-Fi Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }
        
        body {
            background-color: #0a0e17;
            color: #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* Efeito de partículas no fundo */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .jarvis-container {
            width: 380px;
            height: 600px;
            background: rgba(13, 21, 40, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3),
                        inset 0 0 20px rgba(0, 133, 255, 0.2);
            padding: 30px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        
        /* Efeito de digitalização (scanlines) */
        .jarvis-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.2;
        }
        
        /* Efeito de brilho pulsante */
        .jarvis-container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
            animation: pulse 15s infinite alternate;
            z-index: -1;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg) scale(1); opacity: 0.2; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 0.3; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.2; }
        }
        
        /* Efeito de borda brilhante */
        .glow-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5),
                        0 0 40px rgba(0, 133, 255, 0.3);
            pointer-events: none;
            opacity: 0.7;
            z-index: -1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00f0ff, #4a8fe7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 3s infinite alternate;
        }
        
        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); }
            100% { text-shadow: 0 0 20px rgba(0, 240, 255, 1), 0 0 30px rgba(0, 240, 255, 0.5); }
        }
        
        .version {
            font-size: 12px;
            color: #4a8fe7;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
        }
        
        .status {
            text-align: center;
            font-size: 14px;
            color: #ff3c3c;
            margin: 20px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 60, 60, 0.7);
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 8px;
            background: rgba(255, 60, 60, 0.1);
            border-radius: 5px;
            animation: statusPulse 2s infinite;
        }
        
        @keyframes statusPulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .time-display {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }
        
        .time {
            font-size: 52px;
            font-weight: 200;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
            position: relative;
            display: inline-block;
        }
        
        .time::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            animation: linePulse 2s infinite;
        }
        
        @keyframes linePulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        
        .ampm {
            font-size: 18px;
            vertical-align: top;
            margin-left: 5px;
            color: #4a8fe7;
            text-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
        }
        
        .battery {
            font-size: 14px;
            text-align: right;
            color: #4a8fe7;
            margin-top: -25px;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
            position: relative;
            padding-right: 20px;
        }
        
        .battery::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 8px;
            background: rgba(74, 143, 231, 0.3);
            border-radius: 2px;
        }
        
        .battery::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 5px;
            background: #4a8fe7;
            border-radius: 1px;
            box-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
        }
        
        .location {
            text-align: center;
            font-size: 22px;
            letter-spacing: 3px;
            margin: 30px 0 20px 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
            position: relative;
        }
        
        .location::before {
            content: '\f3c5';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: 10px;
            font-size: 18px;
            color: #ff3c3c;
            text-shadow: 0 0 5px rgba(255, 60, 60, 0.7);
        }
        
        .temperature {
            text-align: center;
            font-size: 46px;
            font-weight: 200;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
            position: relative;
        }
        
        .temperature::after {
            content: '°';
            position: absolute;
            top: 0;
            right: 50%;
            margin-right: -50px;
            font-size: 24px;
            color: #4a8fe7;
        }
        
        .forecast {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
            position: relative;
        }
        
        .forecast::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
        }
        
        .day-temp {
            text-align: center;
            font-size: 14px;
            flex: 1;
            position: relative;
            padding: 10px 0;
        }
        
        .day-temp:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 0;
            height: 40px;
            width: 1px;
            background: linear-gradient(transparent, rgba(0, 240, 255, 0.5), transparent);
        }
        
        .temp-value {
            font-size: 18px;
            margin-top: 8px;
            color: #4a8fe7;
            text-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
        }
        
        .date {
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 30px 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
            position: relative;
            padding: 10px 0;
        }
        
        .date::before, .date::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
        }
        
        .date::before {
            top: 0;
        }
        
        .date::after {
            bottom: 0;
        }
        
        .alarm {
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 35px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
            position: relative;
            padding: 12px;
            background: rgba(0, 240, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        
        .alarm::before {
            content: '\f0f3';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: 10px;
            font-size: 16px;
            color: #4a8fe7;
            text-shadow: 0 0 5px rgba(74, 143, 231, 0.7);
        }
        
        .percentage {
            color: #4a8fe7;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(74, 143, 231, 0.7);
        }
        
        /* Efeito de partículas */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 240, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        
        /* Efeito de glitch ocasional */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        .glitch-effect {
            animation: glitch 0.5s infinite;
            display: none;
        }
        
        .jarvis-container:hover .glitch-effect {
            display: block;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="jarvis-container">
        <div class="glow-effect"></div>
        
        <div class="header">
            <div class="title">JARVIS</div>
            <div class="version">v1.0 - build 31</div>
        </div>
        
        <div class="status">LISTENING OFF</div>
        
        <div class="time-display">
            <div class="time">9:24<span class="ampm">AM</span></div>
            <div class="battery">52%</div>
        </div>
        
        <div class="location">DOUSMAN</div>
        <div class="temperature">63°</div>
        
        <div class="forecast">
            <div class="day-temp">
                <div>85°</div>
                <div class="temp-value">15</div>
            </div>
            <div class="day-temp">
                <div>80°</div>
                <div class="temp-value">JUNE</div>
            </div>
            <div class="day-temp">
                <div>78°</div>
                <div class="temp-value">2014</div>
            </div>
        </div>
        
        <div class="date">15 JUNE 2014</div>
        
        <div class="alarm">ALARM SETTINGS <span class="percentage">100%</span></div>
        
        <div class="particles" id="particles"></div>
    </div>

    <script>
        // Criar partículas dinamicamente
        document.addEventListener('DOMContentLoaded', function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Posição aleatória
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                
                // Tamanho aleatório
                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Atraso de animação aleatório
                const delay = Math.random() * 15;
                particle.style.animationDelay = `${delay}s`;
                
                // Duração de animação aleatória
                const duration = Math.random() * 10 + 10;
                particle.style.animationDuration = `${duration}s`;
                
                particlesContainer.appendChild(particle);
            }
            
            // Efeito de glitch aleatório
            setInterval(() => {
                if (Math.random() > 0.8) {
                    document.querySelector('.title').classList.add('glitch-effect');
                    setTimeout(() => {
                        document.querySelector('.title').classList.remove('glitch-effect');
                    }, 200);
                }
            }, 3000);
        });
    </script>
    
    <!-- Biblioteca Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Configuração do particles.js
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#00f0ff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#00f0ff",
                        opacity: 0.2,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 1,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" },
                        resize: true
                    }
                },
                retina_detect: true
            });
        });
    </script>
</body>
</html>
