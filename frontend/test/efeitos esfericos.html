<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUD Sci‑Fi – JARVIS style</title>
  <style>
    :root{
      --bg:#06171a;
      --aqua:#4de5df;
      --aqua-dim:#2ea3a0;
      --white:#eafcff;
      --glass:rgba(77,229,223,.12);
      --glass-2:rgba(77,229,223,.07);
      --warning:#ff8a3d;
      --good:#6aff7e;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background: radial-gradient(1200px 800px at 80% 15%, #0b2b31 0%, var(--bg) 55%), #000;
      color:var(--white); font: 16px/1.4 "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, system-ui, sans-serif;
      overflow:hidden;
    }
    /* subtle background grid / particles */
    .noise{position:fixed; inset:0; pointer-events:none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><g fill="none" stroke="%232a9fa0" stroke-opacity="0.08"><path d="M0 30h60M30 0v60"/><circle cx="30" cy="30" r="29"/></g></svg>'); opacity:.6; mix-blend-mode:screen}

    .wrap{position:relative; height:100%; width:100%; display:grid; place-items:center}

    /* TOP BAR */
    .topbar{position:absolute; top:10px; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:0 22px; text-transform:uppercase; letter-spacing:.18em}
    .brand{font-weight:700; opacity:.9}
    .status{color:var(--aqua); opacity:.85}
    .version{opacity:.5; font-size:.8rem}

    /* CENTRAL HUD */
    .hud{
      position:relative; width:min(82vmin, 780px); aspect-ratio:1/1; display:grid; place-items:center;
      filter: drop-shadow(0 0 12px rgba(77,229,223,.25));
    }
    .ring{position:absolute; inset:0; border-radius:50%;}
    .ring.outer{ box-shadow: 0 0 0 1px rgba(77,229,223,.25) inset, 0 0 20px rgba(77,229,223,.25) inset;}

    /* rotating ticks */
    .ticks, .ticks:before, .ticks:after{position:absolute; inset:7%; border-radius:50%;}
    .ticks{border:2px solid rgba(77,229,223,.22); mask: radial-gradient(circle at center, transparent 64%, #000 65%);}
    .ticks:before{content:""; border:2px dashed rgba(77,229,223,.55); animation:spin 48s linear infinite;}
    .ticks:after{content:""; inset:12%; border:1px dashed rgba(77,229,223,.35); animation:spin-rev 36s linear infinite;}

    /* conic gradient sweep */
    .sweep{position:absolute; inset:0; border-radius:50%; background:
      conic-gradient(from -90deg, transparent 0 78deg, rgba(255,138,61,.92) 78deg 82deg, transparent 82deg 360deg);
      filter: blur(0.4px) drop-shadow(0 0 6px rgba(255,138,61,.5));
      mask: radial-gradient(circle at center, transparent 60%, #000 61%);
    }

    /* inner disc */
    .disc{position:absolute; inset:18%; border-radius:50%; background:
      radial-gradient(60% 60% at 50% 50%, rgba(77,229,223,.08), transparent 60%),
      repeating-radial-gradient(circle at 50% 50%, rgba(77,229,223,.1) 0 2px, transparent 2px 4px),
      radial-gradient(closest-side, rgba(0,0,0,.45), rgba(0,0,0,.1));
      border:1px solid rgba(77,229,223,.18);
      box-shadow: 0 0 0 1px rgba(77,229,223,.12) inset;
    }

    /* center time */
    .time{position:relative; z-index:2; display:flex; align-items:baseline; gap:.6rem; font-variant-numeric:tabular-nums;}
    .time h1{margin:0; font-size:min(12vmin, 110px); font-weight:300; letter-spacing:.02em}
    .time small{font-size:min(3.5vmin, 28px); opacity:.85; margin-left:.2rem}

    /* glass cards */
    .cards{position:absolute; bottom:60px; width:min(90vw, 920px); display:flex; justify-content:space-between; gap:24px}
    .card{flex:1; background:linear-gradient(180deg, var(--glass), var(--glass-2)); border:1px solid rgba(77,229,223,.25); border-radius:18px; padding:18px 20px; box-shadow:0 8px 40px rgba(0,0,0,.35) inset, 0 0 28px rgba(77,229,223,.08) inset; backdrop-filter: blur(10px);} 
    .card h3{margin:0 0 4px; text-transform:uppercase; font-size:.8rem; letter-spacing:.18em; color:var(--aqua)}
    .big{font-size:58px; font-weight:300}
    .muted{opacity:.65}

    /* bottom bar icons */
    .bottombar{position:absolute; left:0; right:0; bottom:14px; display:flex; align-items:center; justify-content:center; gap:32px; opacity:.9}
    .btn{width:58px; height:58px; border:1px solid rgba(77,229,223,.35); border-radius:50%; display:grid; place-items:center; background:radial-gradient(60% 60% at 50% 45%, rgba(77,229,223,.15), rgba(0,0,0,.4)); box-shadow:0 0 22px rgba(77,229,223,.15) inset}
    .btn svg{width:26px; height:26px; opacity:.9}

    /* right widgets */
    .widgets{position:absolute; right:26px; bottom:80px; display:flex; flex-direction:column; gap:12px}
    .chip{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid rgba(77,229,223,.25); border-radius:14px; background:linear-gradient(180deg, var(--glass), transparent)}
    .dot{width:10px; height:10px; border-radius:50%; background:var(--good); box-shadow:0 0 12px var(--good)}

    /* subtle indicator triangles */
    .triangle{position:absolute; top:8px; left:50%; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:14px solid rgba(255,255,255,.6); transform:translateX(-50%)}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spin-rev{to{transform:rotate(-360deg)}}
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">JARVIS</div>
      <div class="status">LISTENING OFF</div>
      <div class="version">v1.0 · build 31</div>
    </div>

    <section class="hud" aria-label="relogio futurista">
      <div class="ring outer"></div>
      <div class="ticks"></div>
      <div class="sweep" aria-hidden="true"></div>
      <div class="disc"></div>
      <div class="triangle"></div>

      <div class="time" id="time">
        <h1>9:24</h1><small><span id="ampm">AM</span>&nbsp;<span class="muted" id="sec">52</span></small>
      </div>

      <div class="cards">
        <div class="card" role="group" aria-label="tempo e clima">
          <h3>Dousman</h3>
          <div style="display:flex; align-items:baseline; gap:16px">
            <div class="big" id="temp">63°</div>
            <div class="muted">F</div>
          </div>
          <div class="muted" style="margin-top:6px">83° | 85° | 80° | 78°</div>
        </div>
        <div class="card" role="group" aria-label="data">
          <h3 id="month">June <span class="muted">2014</span></h3>
          <div class="big" id="day">15</div>
        </div>
      </div>

      <div class="widgets">
        <div class="chip"><div class="dot"></div> 100%</div>
      </div>

      <div class="bottombar">
        <div class="btn" title="Opções">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="btn" title="Microfone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v4"/></svg>
        </div>
        <div class="btn" title="Conexões">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 0 1 20 0"/><path d="M5 12a7 7 0 0 1 14 0"/><circle cx="12" cy="12" r="1.5"/></svg>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Atualiza hora em tempo real
    const timeEl = document.getElementById('time');
    const ampmEl = document.getElementById('ampm');
    const secEl = document.getElementById('sec');
    const dayEl = document.getElementById('day');
    const monthEl = document.getElementById('month');

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    function pad(n){ return String(n).padStart(2,'0'); }

    function tick(){
      const d = new Date();
      let h = d.getHours();
      const m = pad(d.getMinutes());
      const s = pad(d.getSeconds());
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; h = h ? h : 12;
      timeEl.querySelector('h1').textContent = `${h}:${m}`;
      ampmEl.textContent = ampm;
      secEl.textContent = s;
      dayEl.textContent = d.getDate();
      monthEl.innerHTML = `${MONTHS[d.getMonth()]} <span class="muted">${d.getFullYear()}</span>`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
